<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Compliance Checker - Autorisierung</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #33d099 0%, #00939a 33%, #005575 66%, #101e35 100%);
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      padding: 60px 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    p {
      font-size: 18px;
      margin-bottom: 24px;
      opacity: 0.95;
      line-height: 1.6;
    }

    .countdown {
      font-size: 48px;
      font-weight: 700;
      margin-top: 24px;
      opacity: 0.8;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      margin-top: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 32px;
      font-size: 14px;
      opacity: 0.8;
    }

    .footer strong {
      background: linear-gradient(135deg, #e33a74 0%, #FF9220 50%, #fcc001 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✅</div>
    <h1>Autorisierung erfolgreich!</h1>
    <p>
      Du hast die AI Compliance Checker Feedback-App erfolgreich autorisiert.<br>
      Dieses Fenster wird automatisch geschlossen.
    </p>
    <div class="spinner"></div>
    <div class="footer">
      <strong>AI Compliance Checker</strong> • Beta by <strong>BEYONDER</strong>
    </div>
  </div>

  <script>
    /**
     * OAuth Callback Handler
     * Empfängt OAuth Code von GitHub und sendet ihn zurück zur Extension
     */

    // Extrahiere OAuth Code aus URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    const error = urlParams.get('error');
    const errorDescription = urlParams.get('error_description');

    if (error) {
      // Fehler bei OAuth
      document.querySelector('h1').textContent = 'Autorisierung fehlgeschlagen';
      document.querySelector('p').textContent = `Fehler: ${errorDescription || error}`;
      document.querySelector('.icon').textContent = '❌';
      document.querySelector('.spinner').style.display = 'none';

      setTimeout(() => window.close(), 5000);
    } else if (code) {
      console.log('[OAuth Callback] Received code, sending to extension...');

      // Sende Code zurück zur Extension (via postMessage)
      if (window.opener) {
        window.opener.postMessage({
          type: 'github-oauth-callback',
          code: code,
          state: state
        }, '*');

        console.log('[OAuth Callback] Code sent to extension');
      } else {
        console.warn('[OAuth Callback] No opener window found');
      }

      // Auto-Close nach 2 Sekunden
      setTimeout(() => {
        console.log('[OAuth Callback] Closing window...');
        window.close();
      }, 2000);
    } else {
      // Kein Code vorhanden
      document.querySelector('h1').textContent = 'Ungültige Callback-URL';
      document.querySelector('p').textContent = 'Diese Seite wurde direkt aufgerufen. Sie sollte nur als OAuth Callback verwendet werden.';
      document.querySelector('.icon').textContent = '⚠️';
      document.querySelector('.spinner').style.display = 'none';
    }
  </script>
</body>
</html>
